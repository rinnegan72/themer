set -g status-style "bg=default,fg=#3b4051"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#f4f5f9,bg=#315694,bold] #S #[fg=#315694,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#e4e5eb,bg=default]#[fg=#3b4051,bg=#e4e5eb] #h #[fg=#315694,bg=#e4e5eb]#[fg=#f4f5f9,bg=#315694,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#575d72,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#e4e5eb]#[fg=#3b4051,bg=#e4e5eb,bold] #I #W #[fg=#e4e5eb,bg=default]"

set -g pane-border-style "fg=#ced1d8"
set -g pane-active-border-style "fg=#315694"
set -g message-style "bg=#315694,fg=#f4f5f9"
set -g mode-style "bg=#e4e5eb,fg=#3b4051"
