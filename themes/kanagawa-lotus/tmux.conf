set -g status-style "bg=default,fg=#545464"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#f2ecbc,bg=#5d57a3,bold] #S #[fg=#5d57a3,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#dcd5ac,bg=default]#[fg=#545464,bg=#dcd5ac] #h #[fg=#5d57a3,bg=#dcd5ac]#[fg=#f2ecbc,bg=#5d57a3,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#8a8980,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#dcd5ac]#[fg=#545464,bg=#dcd5ac,bold] #I #W #[fg=#dcd5ac,bg=default]"

set -g pane-border-style "fg=#716e61"
set -g pane-active-border-style "fg=#5d57a3"
set -g message-style "bg=#5d57a3,fg=#f2ecbc"
set -g mode-style "bg=#dcd5ac,fg=#545464"
