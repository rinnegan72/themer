set -g status-style "bg=default,fg=#abb2bf"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#282c34,bg=#61afef,bold] #S #[fg=#61afef,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#3e4451,bg=default]#[fg=#abb2bf,bg=#3e4451] #h #[fg=#61afef,bg=#3e4451]#[fg=#282c34,bg=#61afef,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#5c6370,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#3e4451]#[fg=#abb2bf,bg=#3e4451,bold] #I #W #[fg=#3e4451,bg=default]"

set -g pane-border-style "fg=#5c6370"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#61afef,fg=#282c34"
set -g mode-style "bg=#3e4451,fg=#abb2bf"
