set -g status-style "bg=default,fg=#c5c9c5"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#0d0c0c,bg=#8ba4b0,bold] #S #[fg=#8ba4b0,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#282727,bg=default]#[fg=#c5c9c5,bg=#282727] #h #[fg=#8ba4b0,bg=#282727]#[fg=#0d0c0c,bg=#8ba4b0,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#a6a69c,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#282727]#[fg=#c5c9c5,bg=#282727,bold] #I #W #[fg=#282727,bg=default]"

set -g pane-border-style "fg=#a6a69c"
set -g pane-active-border-style "fg=#8ba4b0"
set -g message-style "bg=#8ba4b0,fg=#0d0c0c"
set -g mode-style "bg=#282727,fg=#c5c9c5"
