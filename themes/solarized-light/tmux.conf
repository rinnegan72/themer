set -g status-style "bg=default,fg=#657b83"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#fdf6e3,bg=#268bd2,bold] #S #[fg=#268bd2,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#eee8d5,bg=default]#[fg=#657b83,bg=#eee8d5] #h #[fg=#268bd2,bg=#eee8d5]#[fg=#fdf6e3,bg=#268bd2,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#93a1a1,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#eee8d5]#[fg=#657b83,bg=#eee8d5,bold] #I #W #[fg=#eee8d5,bg=default]"

set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#268bd2,fg=#fdf6e3"
set -g mode-style "bg=#eee8d5,fg=#657b83"
