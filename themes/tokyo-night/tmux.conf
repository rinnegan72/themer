set -g status-style "bg=default,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#292e42,bg=default]#[fg=#c0caf5,bg=#292e42] #h #[fg=#7aa2f7,bg=#292e42]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#292e42]#[fg=#c0caf5,bg=#292e42,bold] #I #W #[fg=#292e42,bg=default]"

set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g mode-style "bg=#292e42,fg=#c0caf5"
