set -g status-style "bg=default,fg=#4c4f69"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#eff1f5,bg=#1e66f5,bold] #S #[fg=#1e66f5,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#ccd0da,bg=default]#[fg=#4c4f69,bg=#ccd0da] #h #[fg=#1e66f5,bg=#ccd0da]#[fg=#eff1f5,bg=#1e66f5,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#9ca0b0,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#ccd0da]#[fg=#4c4f69,bg=#ccd0da,bold] #I #W #[fg=#ccd0da,bg=default]"

set -g pane-border-style "fg=#9ca0b0"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style "bg=#1e66f5,fg=#eff1f5"
set -g mode-style "bg=#ccd0da,fg=#4c4f69"
