set -g status-style "bg=default,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#3b4252,bg=default]#[fg=#d8dee9,bg=#3b4252] #h #[fg=#88c0d0,bg=#3b4252]#[fg=#2e3440,bg=#88c0d0,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#4c566a,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#3b4252]#[fg=#d8dee9,bg=#3b4252,bold] #I #W #[fg=#3b4252,bg=default]"

set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#88c0d0,fg=#2e3440"
set -g mode-style "bg=#3b4252,fg=#d8dee9"
