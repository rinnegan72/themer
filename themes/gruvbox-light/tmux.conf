set -g status-style "bg=default,fg=#3c3836"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#fbf1c7,bg=#076678,bold] #S #[fg=#076678,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#ebdbb2,bg=default]#[fg=#3c3836,bg=#ebdbb2] #h #[fg=#076678,bg=#ebdbb2]#[fg=#fbf1c7,bg=#076678,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#928374,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#ebdbb2]#[fg=#3c3836,bg=#ebdbb2,bold] #I #W #[fg=#ebdbb2,bg=default]"

set -g pane-border-style "fg=#928374"
set -g pane-active-border-style "fg=#076678"
set -g message-style "bg=#076678,fg=#fbf1c7"
set -g mode-style "bg=#ebdbb2,fg=#3c3836"
