set -g status-style "bg=default,fg=#e0def4"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#26233a,bg=default]#[fg=#e0def4,bg=#26233a] #h #[fg=#c4a7e7,bg=#26233a]#[fg=#191724,bg=#c4a7e7,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#6e6a86,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#26233a]#[fg=#e0def4,bg=#26233a,bold] #I #W #[fg=#26233a,bg=default]"

set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#c4a7e7,fg=#191724"
set -g mode-style "bg=#26233a,fg=#e0def4"
