set -g status-style "bg=default,fg=#d8dbe8"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#1a1d29,bg=#9cbcf0,bold] #S #[fg=#9cbcf0,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#272a36,bg=default]#[fg=#d8dbe8,bg=#272a36] #h #[fg=#9cbcf0,bg=#272a36]#[fg=#1a1d29,bg=#9cbcf0,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#aab0c4,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#272a36]#[fg=#d8dbe8,bg=#272a36,bold] #I #W #[fg=#272a36,bg=default]"

set -g pane-border-style "fg=#4a4f60"
set -g pane-active-border-style "fg=#9cbcf0"
set -g message-style "bg=#9cbcf0,fg=#1a1d29"
set -g mode-style "bg=#272a36,fg=#d8dbe8"
