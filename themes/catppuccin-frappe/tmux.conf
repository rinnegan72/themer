set -g status-style "bg=default,fg=#c6d0f5"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#303446,bg=#8caaee,bold] #S #[fg=#8caaee,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#414559,bg=default]#[fg=#c6d0f5,bg=#414559] #h #[fg=#8caaee,bg=#414559]#[fg=#303446,bg=#8caaee,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#949cbb,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#414559]#[fg=#c6d0f5,bg=#414559,bold] #I #W #[fg=#414559,bg=default]"

set -g pane-border-style "fg=#949cbb"
set -g pane-active-border-style "fg=#8caaee"
set -g message-style "bg=#8caaee,fg=#303446"
set -g mode-style "bg=#414559,fg=#c6d0f5"
