set -g status-style "bg=default,fg=#DCD7BA"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#16161D,bg=#7E9CD8,bold] #S #[fg=#7E9CD8,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#2A2A37,bg=default]#[fg=#DCD7BA,bg=#2A2A37] #h #[fg=#7E9CD8,bg=#2A2A37]#[fg=#16161D,bg=#7E9CD8,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#727169,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#2A2A37]#[fg=#DCD7BA,bg=#2A2A37,bold] #I #W #[fg=#2A2A37,bg=default]"

set -g pane-border-style "fg=#727169"
set -g pane-active-border-style "fg=#7E9CD8"
set -g message-style "bg=#7E9CD8,fg=#16161D"
set -g mode-style "bg=#2A2A37,fg=#DCD7BA"
