set -g status-style "bg=default,fg=#839496"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#002b36,bg=#268bd2,bold] #S #[fg=#268bd2,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#073642,bg=default]#[fg=#839496,bg=#073642] #h #[fg=#268bd2,bg=#073642]#[fg=#002b36,bg=#268bd2,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#586e75,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#073642]#[fg=#839496,bg=#073642,bold] #I #W #[fg=#073642,bg=default]"

set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#268bd2,fg=#002b36"
set -g mode-style "bg=#073642,fg=#839496"
