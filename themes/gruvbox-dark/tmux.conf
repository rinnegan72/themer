set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#282828,bg=#83a598,bold] #S #[fg=#83a598,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#3c3836,bg=default]#[fg=#ebdbb2,bg=#3c3836] #h #[fg=#83a598,bg=#3c3836]#[fg=#282828,bg=#83a598,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#928374,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#3c3836]#[fg=#ebdbb2,bg=#3c3836,bold] #I #W #[fg=#3c3836,bg=default]"

set -g pane-border-style "fg=#928374"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "bg=#83a598,fg=#282828"
set -g mode-style "bg=#3c3836,fg=#ebdbb2"
