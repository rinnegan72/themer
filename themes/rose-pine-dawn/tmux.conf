set -g status-style "bg=default,fg=#575279"
set -g status-left-length 40
set -g status-right-length 40

# session name pill
set -g status-left "#[fg=#faf4ed,bg=#907aa9,bold] #S #[fg=#907aa9,bg=default]"

# host + clock pills, right-aligned
set -g status-right "#[fg=#f2e9e1,bg=default]#[fg=#575279,bg=#f2e9e1] #h #[fg=#907aa9,bg=#f2e9e1]#[fg=#faf4ed,bg=#907aa9,bold] %H:%M  %d-%b "

# window tabs: muted inactive, solid accent+surface pill for the active one
set -g window-status-separator ""
set -g window-status-format "#[fg=#9893a5,bg=default] #I #W "
set -g window-status-current-format "#[fg=default,bg=#f2e9e1]#[fg=#575279,bg=#f2e9e1,bold] #I #W #[fg=#f2e9e1,bg=default]"

set -g pane-border-style "fg=#9893a5"
set -g pane-active-border-style "fg=#907aa9"
set -g message-style "bg=#907aa9,fg=#faf4ed"
set -g mode-style "bg=#f2e9e1,fg=#575279"
